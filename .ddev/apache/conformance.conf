# The conformance harness (conformance/, `ddev conformance`): a second TYPO3
# project in the same web container, on its own port. Playwright reaches it
# at http://localhost:8090 inside the container.
Listen 8090
<VirtualHost *:8090>
    DocumentRoot /var/www/html/conformance/public
    <Directory "/var/www/html/conformance/public/">
      AllowOverride All
      Require all granted
    </Directory>
    ErrorLog /dev/stdout
    CustomLog ${APACHE_LOG_DIR}/access.log combined
    LimitRequestFieldSize 16380
</VirtualHost>
