name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: ddev verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ddev/github-action-setup-ddev@v1.12.1
        with:
          autostart: true
      - name: Verify (setup, PHP CS Fixer, PHPStan, PHPUnit, ESLint, Prettier, TypeScript, build, Playwright)
        run: ddev verify
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            example/playwright-report/
            example/test-results/
          if-no-files-found: ignore
