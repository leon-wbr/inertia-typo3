services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  LeonWbr\Inertia\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Event/*'
      - '../Classes/Navigation/*'
      - '../Classes/Props/*'
      - '../Classes/Support/*'
      - '../Classes/Testing/*'

  LeonWbr\Inertia\Service\InertiaService:
    public: true

  LeonWbr\Inertia\Middleware\InertiaMiddleware:
    public: true

  LeonWbr\Inertia\Service\NavigationService:
    public: true

  LeonWbr\Inertia\Service\InertiaContentElementRenderer:
    public: true
